name: Build and Release Production Artifacts

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Domain Engine Unit & Integration Tests
        run: node --test tests/clinic-engine.test.mjs
      - name: Build Next.js Production Web App
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://delight-smile-dental.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy_anon_key' }}

  build-android:
    needs: test-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true
      - name: Scaffold Android Platform Files
        working-directory: ./flutter_app
        run: |
          rm -rf android
          flutter create --platforms=android --org com.delightsmile .
          if [ -f android/app/src/main/kotlin/com/delightsmile/delight_smile_clinic/MainActivity.kt ]; then
            sed -i 's/FlutterActivity/FlutterFragmentActivity/g' android/app/src/main/kotlin/com/delightsmile/delight_smile_clinic/MainActivity.kt
            sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/g' android/app/src/main/kotlin/com/delightsmile/delight_smile_clinic/MainActivity.kt
          fi
          node -e "const fs = require('fs'); fs.appendFileSync('android/build.gradle', '\nsubprojects { plugins.withId(\"com.android.library\") { android { compileSdk = 34 } } }\n');"
      - name: Get Flutter Packages
        working-directory: ./flutter_app
        run: flutter pub get
      - name: Patch Plugin Gradle Specs
        run: |
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter\.compileSdkVersion/34/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter\.minSdkVersion/21/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter\.targetSdkVersion/34/g' {} + || true
      - name: Run Flutter Tests
        working-directory: ./flutter_app
        run: flutter test
      - name: Build Android Release APK
        working-directory: ./flutter_app
        run: flutter build apk --release
      - name: Build Android App Bundle (AAB)
        working-directory: ./flutter_app
        run: flutter build appbundle --release
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: delight-smile-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: delight-smile-android-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab

  build-windows:
    needs: test-web
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      - name: Scaffold Windows Platform Files
        working-directory: ./flutter_app
        run: |
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          flutter create --platforms=windows --org com.delightsmile .
      - name: Get Flutter Packages
        working-directory: ./flutter_app
        run: flutter pub get
      - name: Build Windows Executable
        working-directory: ./flutter_app
        run: flutter build windows --release
      - name: Compress Windows Release
        run: Compress-Archive -Path flutter_app/build/windows/x64/runner/Release/* -DestinationPath delight-smile-windows.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: delight-smile-windows-app
          path: delight-smile-windows.zip

  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: delight-smile-android-apk
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: delight-smile-android-aab
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: delight-smile-windows-app
          path: artifacts
      - name: Create GitHub Release v1.0.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Delight Smile Dental Clinic Official Branding Release v1.0.1"
          body: |
            ## Delight Smile Dental Clinic Management System
            Official cross-platform production release for **Dr. Omar Salem (Alexandria, Egypt)**.
            
            ### Clinic Official Information:
            - **Doctor**: د. عمر سالم (All Dental Specialties / جميع التخصصات)
            - **Location**: الأسكندرية - جليم - ٤ شارع أحمد فتحي برج جليم هايتس الدور الأول
            - **Clinic Phone**: `+20 109 131 3305`
            - **Business / WhatsApp**: `+20 103 436 6020`
            - **Slogan**: *"Your Delight is on your Smile"*
            
            ### Included Artifacts:
            - **Android APK**: `app-release.apk` (Installable testing release for Android)
            - **Android App Bundle (AAB)**: `app-release.aab` (Google Play Console ready)
            - **Windows Desktop App**: `delight-smile-windows.zip` (Native 64-bit desktop application)
          files: |
            artifacts/app-release.apk
            artifacts/app-release.aab
            artifacts/delight-smile-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
