name: Build and Release Production Artifacts

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Domain Engine Unit & Integration Tests
        run: node --test tests/clinic-engine.test.mjs
      - name: Build Next.js Production Web App
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://uujtikjqzeqgbhtudlxc.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy_anon_key' }}

  build-android:
    needs: test-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true
      - name: Scaffold Android Platform Files & Apply Official Branding
        working-directory: ./flutter_app
        run: |
          rm -rf android
          flutter create --platforms=android --org com.delightsmile .
          if [ -f android/app/src/main/kotlin/com/delightsmile/delight_smile_clinic/MainActivity.kt ]; then
            sed -i 's/FlutterActivity/FlutterFragmentActivity/g' android/app/src/main/kotlin/com/delightsmile/delight_smile_clinic/MainActivity.kt
            sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/g' android/app/src/main/kotlin/com/delightsmile/delight_smile_clinic/MainActivity.kt
          fi
          # Set official clinic app name in AndroidManifest
          sed -i 's/android:label="delight_smile_clinic"/android:label="Delight Smile"/g' android/app/src/main/AndroidManifest.xml
          # Copy official gold logo mipmap icons
          if [ -d android_icons ]; then
            cp -r android_icons/* android/app/src/main/res/
          fi
          node -e "const fs = require('fs'); fs.appendFileSync('android/build.gradle', '\nsubprojects { plugins.withId(\"com.android.library\") { android { compileSdk = 34 } } }\n');"
      - name: Get Flutter Packages
        working-directory: ./flutter_app
        run: flutter pub get
      - name: Patch Plugin Gradle Specs
        run: |
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter\.compileSdkVersion/34/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter\.minSdkVersion/21/g' {} + || true
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter\.targetSdkVersion/34/g' {} + || true
      - name: Run Flutter Tests
        working-directory: ./flutter_app
        run: flutter test
      - name: Build Android Release APK
        working-directory: ./flutter_app
        run: flutter build apk --release
      - name: Build Android App Bundle (AAB)
        working-directory: ./flutter_app
        run: flutter build appbundle --release
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: delight-smile-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: delight-smile-android-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    needs: test-web
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true
      - name: Scaffold iOS Platform Files & Inject Official Branding
        working-directory: ./flutter_app
        run: |
          # Keep existing tracked Info.plist and Assets
          cp -r ios /tmp/ios_backup || true
          flutter create --platforms=ios --org com.delightsmile .
          # Restore customized Info.plist and app icons
          if [ -d /tmp/ios_backup ]; then
            cp -r /tmp/ios_backup/* ios/ || true
          fi
      - name: Get Flutter Packages
        working-directory: ./flutter_app
        run: flutter pub get
      - name: Build iOS Application (Release)
        working-directory: ./flutter_app
        run: flutter build ios --no-codesign --release
      - name: Package iOS IPA & Archive
        run: |
          mkdir -p Payload
          cp -r flutter_app/build/ios/iphoneos/Runner.app Payload/
          zip -r -q DelightSmile-iOS.ipa Payload
          zip -r -q DelightSmile-iOS-Runner.zip flutter_app/build/ios/iphoneos/Runner.app
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: delight-smile-ios-ipa
          path: DelightSmile-iOS.ipa
      - name: Upload iOS Runner Artifact
        uses: actions/upload-artifact@v4
        with:
          name: delight-smile-ios-app
          path: DelightSmile-iOS-Runner.zip

  build-windows:
    needs: test-web
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      - name: Scaffold Windows Platform Files & Set App Title
        working-directory: ./flutter_app
        run: |
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          flutter create --platforms=windows --org com.delightsmile .
          # Update window title to Delight Smile Dental Clinic
          (Get-Content windows/runner/main.cpp) -replace 'window.Create\(L"([^"]+)"', 'window.Create(L"Delight Smile Dental Clinic - Dr. Omar Salem"' | Set-Content windows/runner/main.cpp
      - name: Get Flutter Packages
        working-directory: ./flutter_app
        run: flutter pub get
      - name: Build Windows Executable
        working-directory: ./flutter_app
        run: flutter build windows --release
      - name: Compress Windows Release
        run: Compress-Archive -Path flutter_app/build/windows/x64/runner/Release/* -DestinationPath delight-smile-windows.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: delight-smile-windows-app
          path: delight-smile-windows.zip

  create-release:
    needs: [build-android, build-ios, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: delight-smile-android-apk
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: delight-smile-android-aab
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: delight-smile-ios-ipa
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: delight-smile-ios-app
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: delight-smile-windows-app
          path: artifacts
      - name: Create GitHub Release v1.0.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Delight Smile Dental Clinic Official Production Release v1.0.2 (Android, iOS & Windows)"
          body: |
            ## Delight Smile Dental Clinic Management System - Official Release v1.0.2
            Production build featuring the official clinic branding, golden tooth logo launcher icon, academic FDI dental chart, and full cross-platform binaries.
            
            ### Clinic Official Information:
            - **Doctor**: د/ عمر سالم (Dr. Omar Salem)
            - **Specialties**: جميع التخصصات وجراحة وتجميل وزراعة الأسنان
            - **Location**: الأسكندرية - جليم - ٤ شارع أحمد فتحي، برج جليم هايتس، الدور الأول
            - **Clinic Phone**: `+20 109 131 3305`
            - **WhatsApp Booking**: `+20 103 436 6020` ([https://wa.me/201034366020](https://wa.me/201034366020))
            - **Official Slogan**: *"Your Delight is on your Smile"*
            
            ### Official Clinic Schedule:
            - **السبت - الإثنين - الأربعاء**: 12:00 ظهراً - 06:00 مساءً
            - **الأحد - الثلاثاء - الخميس**: 04:00 عصراً - 10:00 مساءً
            - **الجمعة**: إجازة أسبوعية رسمية (مغلق)
            
            ### Downloadable Applications:
            - 📱 **Android App (APK)**: `app-release.apk` (مع شعار العيادة الذهبي الرسمي واسم Delight Smile)
            - 📦 **Android Google Play (AAB)**: `app-release.aab`
            - 🍎 **iPhone & iPad Application (IPA)**: `DelightSmile-iOS.ipa` (تطبيق iOS الأصلي مع أيقونة العيادة)
            - 🍏 **iOS Runner Bundle**: `DelightSmile-iOS-Runner.zip`
            - 💻 **Windows Desktop Application**: `delight-smile-windows.zip` (برنامج الويندوز المكتبي للعيادة)
          files: |
            artifacts/app-release.apk
            artifacts/app-release.aab
            artifacts/DelightSmile-iOS.ipa
            artifacts/DelightSmile-iOS-Runner.zip
            artifacts/delight-smile-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
