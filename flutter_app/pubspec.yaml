name: delight_smile_clinic
description: Complete Cross-Platform Mobile and Desktop Dental Clinic Management Platform for Delight Smile Clinic (Dr. Omar Salem).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  local_auth: ^2.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  file_picker: ^8.0.5
  url_launcher: ^6.3.0
  fl_chart: ^0.68.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  device_info_plus: ^10.1.0

dependency_overrides:
  app_links: ^6.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
