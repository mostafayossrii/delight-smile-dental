      const borderClass = type === 'error' ? 'border-rose-500 bg-rose-950/95 text-rose-100' :
                          type === 'success' ? 'border-emerald-500 bg-emerald-950/95 text-emerald-100' :
                          'border-gold-400 bg-obsidian-900/95 text-gold-100';
      const iconClass = type === 'error' ? 'fa-triangle-exclamation text-rose-400' :
                        type === 'success' ? 'fa-circle-check text-emerald-400' :
                        'fa-crown text-gold-400';

      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border shadow-xl transition-all duration-300 ${borderClass}`;
      toast.innerHTML = `
        <i class="fa-solid ${iconClass} text-lg"></i>
        <div class="text-xs font-semibold leading-relaxed flex-1">${message}</div>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Modal helper
    function openModal(title, htmlContent) {
      const modal = document.getElementById('appModal');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = htmlContent;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('appModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Render Sidebar Navigation
    function renderSidebar() {
      const container = document.getElementById('navLinksContainer');
      if (!container) return;
      container.innerHTML = state.navItems.map(item => {
        const isActive = state.activeTab === item.id;
        return `
          <button data-tab="${item.id}" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-right text-xs font-semibold transition ${isActive ? 'sidebar-item-active font-bold' : 'text-slate-300 hover:bg-obsidian-800 hover:text-gold-200'}">
            <div class="flex items-center gap-2.5 truncate">
              <i class="${item.icon.includes('fa-brands') ? item.icon : 'fa-solid ' + item.icon} w-4 text-center ${isActive ? 'text-gold-400' : 'text-gold-500/70'}"></i>
              <span class="truncate">${item.title}</span>
            </div>
            ${item.badge ? `<span class="text-[10px] px-1.5 py-0.5 rounded-md ${isActive ? 'bg-gold-500 text-obsidian-950 font-bold' : 'bg-obsidian-800 text-gold-400 border border-gold-500/20'}">${item.badge}</span>` : ''}
          </button>
        `;
      }).join('');

      container.querySelectorAll('.nav-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          switchTab(btn.getAttribute('data-tab'));
          // Hide sidebar on mobile after selection
          const sidebar = document.getElementById('sidebarNav');
          if (window.innerWidth < 1024 && !sidebar.classList.contains('hidden')) {
            sidebar.classList.add('hidden');
          }
        });
      });

      const alertBadge = document.getElementById('headerAlertBadge');
      if (alertBadge) alertBadge.textContent = state.alerts.length;
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      renderSidebar();
      renderMainWorkspace();
      window.scrollTo({ top: 0, behavior: 'smooth' });

                  <button data-tool="${t.id}" class="chart-tool-btn px-2.5 py-1.5 rounded-xl text-xs font-bold border transition ${state.selectedChartTool === t.id ? 'gold-gradient text-obsidian-950 border-gold-300 shadow' : 'bg-obsidian-800 ' + t.color}">
                    ${t.label}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- FDI Dentition Mode (Adult 11-48 vs Primary 51-85) & Tooth Surface Selector (M, D, O/I, B/F, L/P) -->
            <div class="p-3.5 rounded-xl bg-obsidian-800/90 border border-gold-500/25 flex flex-wrap items-center justify-between gap-3 text-xs">
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-slate-400 font-semibold">نوع الأسنان (FDI):</span>
                <button id="modePermanentBtn" class="px-3 py-1 rounded-lg font-bold border ${state.dentitionMode === 'permanent' ? 'gold-gradient text-obsidian-950 border-gold-400' : 'bg-obsidian-900 text-slate-300 border-gold-500/20'}">الأسنان الدائمة (11–48)</button>
                <button id="modePrimaryBtn" class="px-3 py-1 rounded-lg font-bold border ${state.dentitionMode === 'primary' ? 'gold-gradient text-obsidian-950 border-gold-400' : 'bg-obsidian-900 text-slate-300 border-gold-500/20'}">الأسنان اللبنية للأطفال (51–85)</button>
              </div>
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-slate-400 font-semibold">سطح السن (Surface):</span>
                ${[
                  { code: 'WHOLE', label: 'كامل السن' },
                  { code: 'M', label: 'M (أنسي)' },
                  { code: 'D', label: 'D (وحشي)' },
                  { code: 'O', label: 'O/I (طاحن/قاطع)' },
                  { code: 'F', label: 'B/F (وجهي/شدقي)' },
                  { code: 'L', label: 'L/P (لساني/حنكي)' }
                ].map(sf => `
                  <button data-surface="${sf.code}" class="surface-sel-btn px-2 py-1 rounded-lg font-mono text-[11px] border ${state.selectedSurface === sf.code ? 'bg-gold-500/25 text-gold-300 border-gold-400 font-bold' : 'bg-obsidian-900 text-slate-400 border-gold-500/15'}">${sf.label}</button>
                `).join('')}
              </div>
              <label class="flex items-center gap-1.5 text-amber-300 cursor-pointer">
                <input id="historicalFindingCheckbox" type="checkbox" ${state.isHistoricalFinding ? 'checked' : ''} class="rounded">
                <span>حالة سابقة (Historical Finding)</span>
              </label>
            </div>

            <!-- Upper Jaw -->
            <div class="space-y-2">
              <div class="text-xs text-center text-gold-400 font-bold">${state.dentitionMode === 'primary' ? 'الفك العلوي - أسنان لبنية (55–65)' : 'الفك العلوي - أسنان دائمة (18–28)'}</div>
              <div class="grid grid-cols-8 sm:grid-cols-16 gap-1.5">
                ${upperTeeth.map(num => {
                  const st = patient.teethStatus[num];
                  return `
                    <button data-tooth="${num}" class="tooth-btn p-2 rounded-xl border flex flex-col items-center justify-center gap-1 ${statusBadgeColor(st)} ${state.selectedTooth === num ? 'ring-2 ring-gold-400' : ''}">
                      <span class="text-[10px] font-mono font-bold">#${num}</span>
                      <i class="fa-solid fa-tooth text-base"></i>
                      <span class="text-[9px] truncate max-w-full">${st ? st.label.split(' ')[0] : 'سليم'}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Lower Jaw -->
            <div class="space-y-2 pt-2">
              <div class="grid grid-cols-8 sm:grid-cols-16 gap-1.5">
                ${lowerTeeth.map(num => {
                  const st = patient.teethStatus[num];
                  return `
                    <button data-tooth="${num}" class="tooth-btn p-2 rounded-xl border flex flex-col items-center justify-center gap-1 ${statusBadgeColor(st)} ${state.selectedTooth === num ? 'ring-2 ring-gold-400' : ''}">
                      <i class="fa-solid fa-tooth text-base"></i>
                      <span class="text-[10px] font-mono font-bold">#${num}</span>
                      <span class="text-[9px] truncate max-w-full">${st ? st.label.split(' ')[0] : 'سليم'}</span>
                    </button>
                  `;
                }).join('')}
              </div>
              <div class="text-xs text-center text-gold-400 font-bold">الفك السفلي (Lower Arch)</div>
            </div>
          </div>

          <!-- Treatment Steps & Automatic Prescriptions & Colleague Notes (Page 12 details) -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Treatment Steps Split by Doctor Share -->
            <div class="bg-obsidian-900 p-5 rounded-2xl gold-border-glow space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-gold-300"><i class="fa-solid fa-list-check ml-1.5"></i>تقسيم العملية على خطوات ونسب الأطباء</h3>
                <span class="text-xs text-slate-400">الإجمالي: ${patient.treatmentSteps.reduce((a, b) => a + b.price, 0).toLocaleString()} ج.م</span>
              </div>
              <div class="space-y-2.5">
                ${patient.treatmentSteps.map(ts => `
                  <div class="p-3 rounded-xl bg-obsidian-800 border border-gold-500/20 flex items-center justify-between gap-2">
                    <div>
                      <div class="text-xs font-bold text-white">${ts.step}</div>
                      <div class="text-[11px] text-slate-400 mt-0.5">الطبيب: <span class="text-gold-300">${ts.doctor}</span> • نسبة الطبيب: <span class="text-emerald-400 font-bold">${ts.sharePct}% (${(ts.price * ts.sharePct / 100).toLocaleString()} ج.م)</span></div>
                    </div>
                    <div class="text-left">
                      <div class="text-xs font-mono font-bold text-gold-400">${ts.price.toLocaleString()} ج.م</div>
                      <span class="text-[10px] px-2 py-0.5 rounded-full bg-gold-500/15 text-gold-300">${ts.status}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Automatic Prescriptions & Colleague Referral Notes -->
            <div class="bg-obsidian-900 p-5 rounded-2xl gold-border-glow space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-gold-300"><i class="fa-solid fa-prescription-bottle-medical ml-1.5"></i>نماذج الوصفات العلاجية التلقائية وملاحظات الزملاء</h3>
                <div class="flex gap-1.5">
                  <button id="autoRxImplantBtn" class="px-2.5 py-1 rounded-lg bg-obsidian-800 hover:bg-obsidian-700 text-gold-300 border border-gold-500/30 text-[11px] font-semibold">+ روشتة جراحة وزراعة</button>
                  <button id="autoRxLaserBtn" class="px-2.5 py-1 rounded-lg bg-obsidian-800 hover:bg-obsidian-700 text-gold-300 border border-gold-500/30 text-[11px] font-semibold">+ روشتة تجميل وليزر</button>
                </div>
              </div>
              <div class="space-y-2">
                ${patient.prescriptions.map(rx => `
                  <div class="p-3 rounded-xl bg-obsidian-800/90 border border-gold-500/25 text-xs">
                    <div class="flex justify-between text-gold-400 font-bold mb-1">
                      <span><i class="fa-solid fa-file-prescription ml-1"></i>روشتة طبية (${rx.id}) - ${rx.doctor}</span>
                      <span class="font-mono">${rx.date}</span>
                    </div>
                    <p class="text-slate-200 leading-relaxed">${rx.meds}</p>
                  </div>
                `).join('')}
              </div>

              <!-- Colleague Note Form -->
              <div class="pt-2 border-t border-gold-500/15">
                <label class="block text-xs text-slate-300 mb-1.5">وضع ملاحظات (كتابة / صوت / مرفقات أشعة) وإرسالها لطبيب زميل:</label>
                <div class="flex gap-2">
                  <input id="colleagueNoteInput" type="text" value="${patient.notes}" class="flex-1 bg-obsidian-800 border border-gold-500/25 rounded-xl px-3 py-2 text-xs text-white">
                  <button id="saveColleagueNoteBtn" class="px-3.5 py-2 rounded-xl gold-gradient text-obsidian-950 font-bold text-xs">حفظ وإرسال للزميل</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('patientSelectDropdown').addEventListener('change', (e) => {
        state.selectedPatientId = e.target.value;
        renderPatients(ws);
      });

      const modePermBtn = document.getElementById('modePermanentBtn');
      const modePrimBtn = document.getElementById('modePrimaryBtn');
      if (modePermBtn && modePrimBtn) {
        modePermBtn.addEventListener('click', () => { state.dentitionMode = 'permanent'; renderPatients(ws); });
        modePrimBtn.addEventListener('click', () => { state.dentitionMode = 'primary'; renderPatients(ws); });
      }
      ws.querySelectorAll('.surface-sel-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedSurface = btn.getAttribute('data-surface');
          renderPatients(ws);
        });
      });
      const histChk = document.getElementById('historicalFindingCheckbox');
      if (histChk) {
        histChk.addEventListener('change', (e) => { state.isHistoricalFinding = e.target.checked; });
      }

      ws.querySelectorAll('.chart-tool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedChartTool = btn.getAttribute('data-tool');
          renderPatients(ws);
        });
      });

      ws.querySelectorAll('.tooth-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const toothNum = parseInt(btn.getAttribute('data-tooth'), 10);
          state.selectedTooth = toothNum;
          const toolMap = {
            veneer: { status: 'veneer', label: 'فينير تجميلي E-Max', doctor: 'د. عمر سالم', price: 6500, sharePct: 45 },
            implant: { status: 'implant', label: 'زراعة سن تيتانيوم', doctor: 'د. عمر سالم', price: 14000, sharePct: 50 },
            root_canal: { status: 'root_canal', label: 'علاج جذور + حشو عصب', doctor: 'د. رامي طارق', price: 4200, sharePct: 40 },
            crown: { status: 'crown', label: 'طربوش زيركون', doctor: 'د. عمر سالم', price: 3800, sharePct: 45 },
            filling: { status: 'filling', label: 'حشو تجميلي كومبوزيت', doctor: 'د. سارة عادل', price: 1200, sharePct: 35 },
            caries: { status: 'caries', label: 'تسوس يحتاج علاج', doctor: 'د. عمر سالم', price: 1100, sharePct: 40 }
          };

          if (state.selectedChartTool === 'clear') {
            delete patient.teethStatus[toothNum];
            showToast(`تم مسح الحالة المسجلة على السن رقم #${toothNum}`);
          } else {
            const chosen = toolMap[state.selectedChartTool];
            patient.teethStatus[toothNum] = chosen;
            patient.treatmentSteps.unshift({
              id: 'TS-' + Math.floor(100 + Math.random() * 900),
              step: `${chosen.label} للسن رقم #${toothNum}`,
              doctor: chosen.doctor,
              sharePct: chosen.sharePct,
              price: chosen.price,
              status: 'جديد بالخطة'
            });
            showToast(`تم إضافة "${chosen.label}" للسن #${toothNum} وإدراجه بالخطة العلاجية`, 'success');
          }
          renderPatients(ws);
        });
      });

      document.getElementById('autoRxImplantBtn').addEventListener('click', () => {
        patient.prescriptions.unshift({
          id: 'RX-' + Math.floor(300 + Math.random() * 600),
          date: '2026-10-26',
          doctor: 'د. عمر سالم',
          meds: 'Hibiotic 1g قرص كل 12 ساعة لمدة 7 أيام • Cataflam 50mg بعد الأكل • مضمضة Orovex بعد 24 ساعة من الزراعة'
        });
        showToast('تم إنشاء روشتة الزراعة والجراحة التلقائية وإضافتها لملف المريض', 'success');
        renderPatients(ws);
      });

      document.getElementById('autoRxLaserBtn').addEventListener('click', () => {
        patient.prescriptions.unshift({
          id: 'RX-' + Math.floor(300 + Math.random() * 600),
          date: '2026-10-26',
          doctor: 'د. عمر سالم',
          meds: 'جل ملطف للثة Gengigel ثلاث مرات يومياً • معجون Sensodyne Repair & Protect • تجنب المشروبات الملونة لمدة 48 ساعة'
        });
        showToast('تم إنشاء روشتة التجميل والليزر التلقائية بنجاح', 'success');
        renderPatients(ws);
      });

      document.getElementById('saveColleagueNoteBtn').addEventListener('click', () => {
        patient.notes = document.getElementById('colleagueNoteInput').value;
        showToast('تم حفظ الملاحظة الطبية وإرسال إشعار للطبيب الزميل', 'success');
      });

      document.getElementById('mergeDuplicatesBtn').addEventListener('click', () => {
        openModal('كشف الملفات المكررة ودمجها معاً', `
          <div class="space-y-3 text-xs">
            <div class="p-3 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-200">
              <i class="fa-solid fa-magnifying-glass-chart ml-1"></i> قام النظام بفحص 1,141 ملف مريض واكتشف تطابق في رقم الهاتف <span class="font-mono">+20 103 655 4750</span>:
            </div>
            <div class="p-3 rounded-xl bg-obsidian-800 border border-gold-500/20">
              <div class="font-bold text-white">1. نورهان محمد عبد الرحمن (P-1001) - الملف الأساسي</div>
              <div class="text-slate-400 mt-0.5">تاريخ الإنشاء: يناير 2026 • يحتوي على 3 خطط علاجية وفاتورتين</div>
            </div>
            <div class="p-3 rounded-xl bg-obsidian-800 border border-gold-500/20">
              <div class="font-bold text-white">2. نورهان محمد (P-1098) - سجل مكرر من الحجز الأونلاين</div>
              <div class="text-slate-400 mt-0.5">تاريخ الإنشاء: أكتوبر 2026 • يحتوي على حجز استشارة فقط</div>
            </div>
            <button id="confirmMergeAction" class="w-full py-2.5 rounded-xl gold-gradient text-obsidian-950 font-extrabold">دمج الملفين في ملف واحد (P-1001) بدون فقدان أي بيانات</button>
          </div>
        `);
        document.getElementById('confirmMergeAction').addEventListener('click', () => {
          closeModal();
          showToast('تم دمج الملف المكرر بنجاح في ملف المريضة نورهان محمد (P-1001)', 'success');
        });
      });

      document.getElementById('newPatientModalBtn').addEventListener('click', () => {
        openModal('إضافة ملف مريض جديد', `
          <form id="modalNewPatientForm" class="space-y-3 text-xs">
            <div>
              <label class="block text-slate-300 mb-1">اسم المريض ثلاثي</label>
              <input id="npName" type="text" required placeholder="مثال: دينا طارق عبد الله" class="w-full bg-obsidian-800 border border-gold-500/30 rounded-xl px-3 py-2 text-white">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-slate-300 mb-1">رقم الموبايل</label>
                <input id="npPhone" type="text" required value="+20 109 887 6543" class="w-full bg-obsidian-800 border border-gold-500/30 rounded-xl px-3 py-2 text-white font-mono">
              </div>
              <div>
                <label class="block text-slate-300 mb-1">السن</label>
                <input id="npAge" type="number" required value="31" class="w-full bg-obsidian-800 border border-gold-500/30 rounded-xl px-3 py-2 text-white">
              </div>
            </div>
            <div>
              <label class="block text-slate-300 mb-1">شركة التأمين</label>
              <input id="npIns" type="text" value="AXA للتأمين الطبي" class="w-full bg-obsidian-800 border border-gold-500/30 rounded-xl px-3 py-2 text-white">
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl gold-gradient text-obsidian-950 font-extrabold">إنشاء الملف وفتح مخطط الأسنان</button>
          </form>
        `);
        document.getElementById('modalNewPatientForm').addEventListener('submit', (ev) => {
          ev.preventDefault();
          const newId = 'P-' + (1000 + state.patients.length + 1);
          state.patients.push({
            id: newId,
            name: document.getElementById('npName').value.trim(),
            phone: document.getElementById('npPhone').value.trim(),
            age: parseInt(document.getElementById('npAge').value, 10) || 30,
            gender: 'أنثى',
            area: 'الإسكندرية',
            insurance: document.getElementById('npIns').value.trim(),
            membershipNo: 'VIP-' + Math.floor(1000 + Math.random() * 9000),
            points: 500,
            usedPoints: 0,
            creditBalance: 0,
            medicalHistory: ['لا توجد أمراض مزمنة مسجلة'],
            notes: 'مريض جديد مسجل بالنظام.',
            teethStatus: {},
            treatmentSteps: [],
            prescriptions: [],
            consents: []
          });
          state.selectedPatientId = newId;
          closeModal();
          showToast('تم إنشاء ملف المريض الجديد بنجاح', 'success');
          renderPatients(ws);
        });
      });
    }

    // 5. PATIENT QR-CODE & SELF-SERVICE PORTAL (صفحة 9: QR-Code للمرضى + استرجاع الفاتورة والروشتة + نموذج موافقة وتوقيع المريض)
    function renderQrCodePortal(ws) {
      const patient = state.patients.find(p => p.id === state.selectedPatientId) || state.patients[0];

      ws.innerHTML = `
        <div class="space-y-6">
          <div class="bg-obsidian-900 p-5 rounded-2xl gold-border-glow flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-extrabold gold-text-gradient"><i class="fa-solid fa-qrcode ml-2"></i>QR-Code وبوابة الخدمة الذاتية للمرضى</h2>
              <p class="text-xs text-slate-400 mt-1">ابهر المرضى بتقدم عيادتك.. تسجيل البيانات والحجز أونلاين، استرجاع الفاتورة والروشتة على الهاتف، وتوقيع نموذج الموافقة إلكترونياً.</p>
            </div>
            <select id="qrPatientSelector" class="bg-obsidian-800 border border-gold-500/40 rounded-xl px-3 py-2 text-xs text-gold-200 font-bold">
              ${state.patients.map(p => `<option value="${p.id}" ${p.id === patient.id ? 'selected' : ''}>معاينة هاتف المريض: ${p.name}</option>`).join('')}
            </select>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <!-- Mobile Phone Mockup (Matching Page 9 of Brochure with Delight Smile Branding) -->
            <div class="lg:col-span-5 flex justify-center">
              <div class="w-full max-w-sm bg-obsidian-950 border-4 border-gold-500/60 rounded-[2.5rem] p-5 shadow-2xl space-y-4 relative">
                <div class="w-24 h-1.5 bg-gold-500/30 rounded-full mx-auto"></div>

                <!-- Clinic Logo Inside Mobile Portal -->

        if (user === 'admin' && pass === '123') {
          if (!newPass || newPass.length < 8 || newPass === '123') {
            showToast('يرجى إدخال كلمة مرور جديدة قوية (8 أحرف على الأقل ومختلفة عن 123) لإتمام أول تسجيل دخول!', 'error');
            return;
          }
          state.adminPasswordHash = newPass;
          state.mustChangePassword = false;
          state.auditLogs.unshift({
            id: 'AUD-' + (state.auditLogs.length + 101),
            time: 'الآن',
            actor: 'admin',
            role: 'Administrator',
            action: 'FIRST_LOGIN_PASSWORD_CHANGED',
            table: 'profiles',
            details: 'تم تسجيل الدخول بحساب admin وتغيير كلمة المرور الافتراضية (123) بنجاح'
          });
          closeModal();
          showToast('تم تسجيل الدخول وتغيير كلمة المرور الافتراضية (123) إلى كلمة مرور قوية بنجاح!', 'success');
          renderMainWorkspace();
        } else {
          closeModal();
          showToast(`تم تسجيل الدخول بنجاح بالحساب: ${user}`, 'success');
        }
      });
    }

    // ==========================================
    // GLOBAL LISTENERS & INITIALIZATION
    // ==========================================
    function initDelightSmileApp() {
      if (window.__delightInitialized) return;
      window.__delightInitialized = true;
      renderSidebar();
      renderMainWorkspace();

      // Mobile sidebar toggle
      document.getElementById('mobileMenuBtn').addEventListener('click', () => {
        const sb = document.getElementById('sidebarNav');
        sb.classList.toggle('hidden');
        sb.classList.toggle('fixed');
        sb.classList.toggle('inset-y-0');
        sb.classList.toggle('right-0');
      });

      // Clicking Logo returns to Index Hub (As instructed in Brochure Page 5: وللرجوع هنا اضغط على الشعار في أي صفحة)
      document.getElementById('logoHomeBtn').addEventListener('click', () => {
        switchTab('index_hub');
        showToast('تم الانتقال إلى فهرس النظام الشامل (كما في البروشور)');
      });

      document.getElementById('quickIndexBtn').addEventListener('click', () => {
        switchTab('index_hub');
      });

      document.getElementById('quickNewBookingBtn').addEventListener('click', () => {
        switchTab('appointments');
      });

      document.getElementById('topAlertsBtn').addEventListener('click', () => {
        switchTab('alerts_support');
      });

      document.getElementById('closeModalBtn').addEventListener('click', closeModal);

      // Role Switcher (6 Staff Roles + Isolated Patient Portal)
      const roleSwitcher = document.getElementById('globalRoleSwitcher');
      if (roleSwitcher) {
        roleSwitcher.addEventListener('change', (e) => {
          state.currentRole = e.target.value;
          if (state.currentRole === 'patient') {
            switchTab('patient_portal_isolated');
            showToast('تم التبديل إلى بوابة المريض المستقلة (Isolated Patient Portal)');
          } else {
            showToast(`تم تفعيل صلاحيات الدور: ${state.currentRole}`);
            renderMainWorkspace();
          }
        });
      }

      // Auth Login Modal button
      const authBtn = document.getElementById('openAuthModalBtn');
      if (authBtn) {
        authBtn.addEventListener('click', openAuthLoginModal);
      }

      // RTL Arabic / LTR English Toggle
      const langBtn = document.getElementById('toggleLangBtn');
      if (langBtn) {
        langBtn.addEventListener('click', () => {
          state.locale = state.locale === 'ar' ? 'en' : 'ar';
          document.documentElement.dir = state.locale === 'ar' ? 'rtl' : 'ltr';
          document.documentElement.lang = state.locale;
          showToast(state.locale === 'ar' ? 'تم تفعيل اللغة العربية واتجاه RTL' : 'Switched to English (LTR Layout)');
        });
      }

      // Dark / Light Theme Toggle
      const themeBtn = document.getElementById('toggleThemeBtn');
      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          document.documentElement.classList.toggle('light-theme');
          const isLight = document.documentElement.classList.contains('light-theme');
          state.theme = isLight ? 'light' : 'dark';
          themeBtn.innerHTML = isLight ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
          renderSidebar();
          renderMainWorkspace();
          showToast(isLight ? 'تم تفعيل الوضع النهاري الواضح (Warm Ivory & Royal Gold)' : 'تم تفعيل الوضع الليلي الذهبي الفاخر (Dark Obsidian & Gold)');
        });
      }

      document.getElementById('branchSelector').addEventListener('change', (e) => {
        state.currentBranch = e.target.value;
        showToast(`تم التبديل إلى: ${state.currentBranch}`);
        renderMainWorkspace();
      });

      // Global patient search jumps straight to matching patient profile
      document.getElementById('globalPatientSearch').addEventListener('input', (e) => {
        const q = e.target.value.trim();
        if (q.length >= 2) {
          const found = state.patients.find(p => p.name.includes(q) || p.phone.includes(q) || p.id.toLowerCase().includes(q.toLowerCase()));
          if (found) {
            state.selectedPatientId = found.id;
            if (state.activeTab !== 'patients') {
              switchTab('patients');
            } else {
              renderMainWorkspace();
            }
            showToast(`تم فتح ملف المريض: ${found.name}`);
          }
        }
      });

      // Attendance live clock tick
      setInterval(() => {
        if (state.attendanceTimerRunning) {
          state.attendanceSeconds += 1;
        }
      }, 1000);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDelightSmileApp);
    } else {
      initDelightSmileApp();
    }
  </script>
</body>
</html>
